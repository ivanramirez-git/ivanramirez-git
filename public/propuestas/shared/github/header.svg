<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Iván René Ramírez Castro, Ingeniero de Software"><title>Iván René Ramírez Castro, Ingeniero de Software</title><style>:root{--bg:#FFFFFF;--card:#F8F9FC;--ink:#101828;--body:#344054;--mute:#667085;--line:#E4E7EC;--acc:#3E3BD6;--acc2:#6E6BF0;--tile:#101828;--ok:#16A34A;--chip:#FFFFFF}@media (prefers-color-scheme: dark){:root{--bg:#0D1117;--card:#161B22;--ink:#F0F3F8;--body:#C9D1D9;--mute:#8B949E;--line:#30363D;--acc:#A5A4FF;--acc2:#7C7AF5;--tile:#1D2939;--ok:#3FB950;--chip:#0D1117}}.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}.in{animation:in .8s cubic-bezier(.2,.7,.2,1) both}@keyframes in{from{transform:translateY(8px)}to{transform:none}}.sweep{animation:sw 6s ease-in-out 1s infinite}@keyframes sw{from{transform:translateX(0)}to{transform:translateX(1600px)}}@media (prefers-reduced-motion: reduce){.in{animation:none}.sweep{display:none}}</style><rect width="1200" height="300" rx="20" style="fill:var(--bg);stroke:var(--line)"/><defs><pattern id="d" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" style="fill:var(--mute)" fill-opacity=".22"/></pattern><linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#3E3BD6" stop-opacity="0"/><stop offset=".5" stop-color="#6E6BF0" stop-opacity=".22"/><stop offset="1" stop-color="#3E3BD6" stop-opacity="0"/></linearGradient><clipPath id="c"><rect width="1200" height="300" rx="20"/></clipPath></defs><g clip-path="url(#c)"><rect width="1200" height="300" fill="url(#d)"/><rect class="sweep" x="-400" y="0" width="400" height="300" fill="url(#sweep)"/></g><rect x="56" y="70" width="160" height="160" rx="37.9" style="fill:var(--tile)"/><text x="136.0" y="173.2" text-anchor="middle" class="sans" font-size="63.2" font-weight="800" fill="#FFFFFF" letter-spacing="-2.1">IR</text><circle cx="194.9" cy="208.9" r="8.4" style="fill:var(--acc2)"/><g class="in" style="animation-delay:.1s"><text x="256" y="104" class="mono" font-size="14" font-weight="700" letter-spacing="2.6" style="fill:var(--acc)">INGENIERO DE SOFTWARE · FULL STACK · SRE</text></g><g class="in" style="animation-delay:.25s"><text x="254" y="160" class="sans" font-size="48" font-weight="800" letter-spacing="-1.4" style="fill:var(--ink)">Iván René Ramírez Castro</text></g><g class="in" style="animation-delay:.4s"><text x="256" y="200" class="sans" font-size="22" style="fill:var(--body)">Construyo software que llega a producción, y lo mantengo ahí.</text></g><g class="in" style="animation-delay:.55s"><circle cx="266" cy="238" r="9" style="fill:var(--ok)" fill-opacity=".2"><animate attributeName="r" values="6;11;6" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="266" cy="238" r="5" style="fill:var(--ok)"/><text x="284" y="243" class="sans" font-size="15" style="fill:var(--mute)">Disponible para proyectos · remoto desde Tame, Arauca, Colombia</text></g></svg>