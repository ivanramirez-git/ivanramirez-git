<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24" role="img" aria-label=""><title></title><style>:root{--bg:#FFFFFF;--card:#F8F9FC;--ink:#101828;--body:#344054;--mute:#667085;--line:#E4E7EC;--acc:#3E3BD6;--acc2:#6E6BF0;--tile:#101828;--ok:#16A34A;--chip:#FFFFFF}@media (prefers-color-scheme: dark){:root{--bg:#0D1117;--card:#161B22;--ink:#F0F3F8;--body:#C9D1D9;--mute:#8B949E;--line:#30363D;--acc:#A5A4FF;--acc2:#7C7AF5;--tile:#1D2939;--ok:#3FB950;--chip:#0D1117}}.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style><line x1="0" y1="12" x2="1000" y2="12" style="stroke:var(--line)" stroke-dasharray="4 6"/><circle cx="500" cy="12" r="5" style="fill:var(--acc)"><animate attributeName="cx" values="0;1000" dur="5s" repeatCount="indefinite"/></circle></svg>