<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 300" width="590" height="300" role="img" aria-label="Software que mueve dinero y cosas"><title>Software que mueve dinero y cosas</title><style>:root{--bg:#FFFFFF;--card:#F8F9FC;--ink:#101828;--body:#344054;--mute:#667085;--line:#E4E7EC;--acc:#3E3BD6;--acc2:#6E6BF0;--tile:#101828;--ok:#16A34A;--chip:#FFFFFF}@media (prefers-color-scheme: dark){:root{--bg:#0D1117;--card:#161B22;--ink:#F0F3F8;--body:#C9D1D9;--mute:#8B949E;--line:#30363D;--acc:#A5A4FF;--acc2:#7C7AF5;--tile:#1D2939;--ok:#3FB950;--chip:#0D1117}}.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}.pop{animation:pop .6s ease-out both}@keyframes pop{from{transform:translateY(5px)}to{transform:none}}@media (prefers-reduced-motion: reduce){.pop{animation:none}}</style><rect x=".5" y=".5" width="589" height="299" rx="18" style="fill:var(--card);stroke:var(--line)"/><text x="28" y="42" class="mono" font-size="12" font-weight="700" letter-spacing="2.2" style="fill:var(--acc)">QUÉ CONSTRUYO</text><text x="28" y="78" class="sans" font-size="24" font-weight="800" letter-spacing="-.5" style="fill:var(--ink)">Software que mueve dinero y cosas</text><g class="pop" style="animation-delay:0.15s"><rect x="28" y="113" width="6" height="6" rx="1.5" style="fill:var(--acc)"/><text x="46" y="122" class="sans" font-size="15" style="fill:var(--body)">Pagos en punto de venta e integración con bancos</text></g><g class="pop" style="animation-delay:0.27s"><rect x="28" y="139" width="6" height="6" rx="1.5" style="fill:var(--acc)"/><text x="46" y="148" class="sans" font-size="15" style="fill:var(--body)">Fintech: originación de crédito, KYC y biometría</text></g><g class="pop" style="animation-delay:0.39s"><rect x="28" y="165" width="6" height="6" rx="1.5" style="fill:var(--acc)"/><text x="46" y="174" class="sans" font-size="15" style="fill:var(--body)">Control de acceso IoT en aeropuertos</text></g><g class="pop" style="animation-delay:0.51s"><rect x="28" y="191" width="6" height="6" rx="1.5" style="fill:var(--acc)"/><text x="46" y="200" class="sans" font-size="15" style="fill:var(--body)">Plataformas multi-tenant y apps móviles</text></g><g class="pop" style="animation-delay:0.63s"><rect x="28" y="217" width="6" height="6" rx="1.5" style="fill:var(--acc)"/><text x="46" y="226" class="sans" font-size="15" style="fill:var(--body)">IA aplicada: análisis de documentos y búsqueda</text></g></svg>