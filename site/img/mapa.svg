<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260">
  <style>
    .pt{fill:#667085;opacity:.55}
    .arco{fill:none;stroke:#3E3BD6;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:260;stroke-dashoffset:260;animation:traza 5s ease-in-out infinite}
    .a2{animation-delay:.6s}.a3{animation-delay:1.2s}
    .punto{fill:#101828}.casa,.mundo{fill:#F59E0B}
    .halo{fill:#F59E0B;transform-origin:201.9px 106.8px;animation:halo 2.2s ease-out infinite}
    .lbl{font:700 12px ui-monospace,Menlo,Consolas,monospace;fill:#475467;paint-order:stroke;stroke:#F2F4F8;stroke-width:4px;stroke-linejoin:round}
    .casa-lbl{fill:#B45309}
    @keyframes traza{0%{stroke-dashoffset:260}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-260}}
    @keyframes halo{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
    @media (prefers-color-scheme:dark){.pt{fill:#8A92A6}.arco{stroke:#A5A4FF}.punto{fill:#EEF0F5}.lbl{fill:#B4BBCB;stroke:#141B2B}.casa-lbl{fill:#F59E0B}}
    @media (prefers-reduced-motion:reduce){.arco{animation:none;stroke-dashoffset:0}.halo{animation:none;opacity:0}}
  </style>
